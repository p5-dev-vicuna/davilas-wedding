# One-off: force-deploy production because the Coolify webhook missed the
# palette-swap push (known failure mode, see CLAUDE.md "Deploying").
# Uses the repo's COOLIFY_API_TOKEN secret — the same credential
# branch-preview.yml uses. DELETE THIS FILE after the deploy lands.
name: Force deploy main (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  force-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify force deploy for production
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          # Cloudflare fronts the Coolify API and 403s default library
          # User-Agents, so claim to be a plain browser (same as
          # branch-preview.yml).
          code="$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -A "Mozilla/5.0" \
            "https://coolify.parallel5.com/api/v1/deploy?uuid=ocged1iwh5w7lhnhapsh7jg5&force=true")"
          echo "HTTP ${code}"
          cat /tmp/resp.json || true
          echo ""
          # Coolify answers 200 with a deployment UUID on success.
          test "$code" = "200"
