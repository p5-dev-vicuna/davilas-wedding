<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apple touch icon template — The Davilas</title>
    <!-- Build-time template for the 180x180 apple-touch-icon
         (screenshotted by scripts/generate-og.mjs into
         public/apple-touch-icon.png). Mirrors public/favicon.svg exactly,
         full-bleed: iOS applies its own rounded mask at install time. -->
    <style>
      :root {
        --sage: #4c563f;
        --gold: #b78953;
        --gold-bright: #d9bc8e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        position: relative;
        width: 180px;
        height: 180px;
        overflow: hidden;
        background: var(--sage);
      }

      /* hairline inner frame — 1.5px at 64px viewBox scale ~ 4.2px here */
      .frame {
        position: absolute;
        inset: 17px;
        border: 4px solid var(--gold);
        opacity: 0.9;
      }

      .ornament {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }

      .ornament .rule {
        width: 31px;
        height: 4px;
        background: var(--gold);
      }

      .ornament .diamond {
        width: 34px;
        height: 34px;
        background: var(--gold-bright);
        transform: rotate(45deg);
      }
    </style>
  </head>
  <body>
    <div class="frame" aria-hidden="true"></div>
    <div class="ornament" aria-hidden="true">
      <span class="rule"></span>
      <span class="diamond"></span>
      <span class="rule"></span>
    </div>
  </body>
</html>
